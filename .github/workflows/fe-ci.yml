# Frontend（helpdesk-fe）の CI
#
# push と PR のたびに、1 つのジョブ（check）の中で次の 4 つを順に実行する。どれかが失敗すると PR に ❌ が付く。
#   - Lint   : ESLint で問題を検出する（yarn lint と同じ）
#   - Format : Prettier で書式がそろっているか確認する（yarn format:check と同じ）
#   - Test   : Vitest で単体テストを実行する（yarn test と同じ）
#   - Build  : 型チェックと本番用のビルドを行う（yarn build と同じ内容を 2 ステップに分けて実行）。
#              Vitest は型チェックをしないため、型の誤りはここで見つける
# 最後に result で、結果をまとめて判定する。
#
# 4 つのチェック自体は合計 10 秒ほどで、時間の大半は準備（checkout・setup-node・yarn install）のため、
# 準備を 1 回で済ませるよう 1 つのジョブにまとめている。1 つのチェックが失敗しても残りのチェックは実行し、
# どれが失敗したかはステップ名で分かるようにしている。
#
# E2E テスト（Playwright）は BE を起動した状態で動かす前提のため、ここでは実行しない。
#
# FE に変更がないとき（BE だけの変更など）は、check をスキップする。
# スキップされたジョブは GitHub 上で「成功」扱いになるため、マージは止まらない。
# （ワークフロー自体を paths で絞ると、チェックが届かずマージできなくなるため、この方式にしている）
#
# 使用するアクションは、タグの付け替えによるすり替え（サプライチェーン攻撃）を防ぐため、
# 公式のもの（actions/*）も含めてすべてコミット SHA で指定する（後ろのコメントは対応するバージョン）。
# 版を上げるときは、新しい版のタグが指すコミットの SHA を本家のリポジトリで確認して書き換える

name: FE CI

on:
  push:
    # ブランチへの push だけで動かす（リリースのタグを付けたときには動かさない）
    branches: ["**"]
  pull_request:

# 同じブランチ・PR で新しく実行されたら、古い実行は止める。
# ただし develop と main は止めない（続けてマージしたとき、前のマージの結果も残すため）
concurrency:
  group: fe-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

# コードの読み取りだけを許可する
permissions:
  contents: read

defaults:
  run:
    working-directory: helpdesk-fe

jobs:
  # FE に関係するファイルが変わったかを判定する
  changes:
    name: fe-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 比べる相手
          # - PR のとき：PR のマージ先。base は使われず、指定すると警告が出るため空にする
          # - push のとき：develop から分かれた地点（develop 自身への push は、push の直前のコミット）
          #   指定しないとリポジトリの既定ブランチ（main）と比べるため、develop にあって main にない
          #   FE の変更まで拾ってしまい、BE だけの変更でもスキップされなくなる
          base: ${{ github.event_name == 'push' && 'develop' || '' }}
          filters: |
            fe:
              - 'helpdesk-fe/**'
              - '.github/workflows/fe-ci.yml'

  check:
    name: fe-check
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node.js のバージョンは helpdesk-fe/.nvmrc（ローカルと同じ）を使う。
      # setup-node は ESLint / TypeScript のエラーを PR のコード上に表示する仕組みも登録する
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: helpdesk-fe/.nvmrc
          cache: yarn
          cache-dependency-path: helpdesk-fe/yarn.lock
      # yarn.lock と package.json が食い違っていたら失敗させる（lock の更新漏れを見つける）
      - name: パッケージをインストール
        id: install
        run: yarn install --frozen-lockfile

      # ここから 4 つのチェック。インストールが成功していれば、前のチェックが失敗しても次のチェックを実行する
      # （1 回の実行で、すべての問題が分かるようにするため）。1 つでも失敗すれば fe-check は失敗になる
      - name: "Lint: ESLint で問題を検出する"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint
      - name: "Format: Prettier で書式を確認する"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn format:check
      # GitHub Actions 上では、Vitest が失敗したテストを PR のコード上にも表示する
      - name: "Test: Vitest で単体テストを実行する"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test
      # yarn build（tsc -b && vite build）と同じことを 2 つに分けて行う。
      # 型チェックはリポジトリ直下から実行し、エラーのパスを helpdesk-fe/src/... の形にする。
      # helpdesk-fe で実行すると src/... の形になり、GitHub がファイルを見つけられず、
      # 型エラーが PR のコード上に表示されないため
      - name: "Build: 型チェックを行う"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: helpdesk-fe/node_modules/.bin/tsc -b helpdesk-fe
      - name: "Build: 本番用のビルドを行う"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn vite build

  # 結果をまとめて判定する
  # fe-changes が失敗すると check は「スキップ」になり、GitHub はスキップを「成功」と扱うため、
  # 何も確認しないままマージできてしまう。それを防ぐため、どれかが失敗・中断していたら失敗にする
  result:
    name: fe-result
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: 各ジョブの結果を表示する
        run: |
          echo "fe-changes: ${{ needs.changes.result }}"
          echo "fe-check  : ${{ needs.check.result }}"
      - name: 失敗・中断したジョブがあれば失敗にする
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::FE CI のジョブに失敗または中断したものがあります。上の結果を確認してください"
          exit 1
