[project]
name = "helpdesk-be"
version = "0.1.0"
description = "Novel HELPDESK backend API"
authors = [
    {name = "novel-wakai",email = "96455219+novel-wakai@users.noreply.github.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pymysql (>=1.2.4,<2.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "email-validator (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
]

[tool.ruff]
# 1 行の長さ（FE の Prettier と合わせて 100 文字）
line-length = 100
target-version = "py313"
# 自動生成されるマイグレーションファイルは対象外
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle（基本的なスタイルの誤り）
    "W",  # pycodestyle（警告）
    "F",  # Pyflakes（未使用の import・変数、未定義の名前など）
    "I",  # isort（import の並び順）
    "B",  # flake8-bugbear（よくあるバグのパターン）
    "UP", # pyupgrade（古い書き方を新しい Python の書き方に）
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI の依存性注入（引数の既定値に Depends() などを書く）は正しい書き方のため、B008 の対象外にする
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
