[project]
name = "helpdesk-be"
version = "0.1.0"
description = "Novel HELPDESK backend API"
authors = [
    {name = "novel-wakai",email = "96455219+novel-wakai@users.noreply.github.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy (>=2.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pymysql (>=1.2.4,<2.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "email-validator (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
]
